<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genzie Hub</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #0f2e1a 0%, #1a4d2e 50%, #0f2e1a 100%);
            color: white;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Płynące, animowane plamy koloru w tle (liquid blobs) */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.45;
            will-change: transform;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: #e1306c;
            top: 5%;
            left: -10%;
            animation: float1 18s ease-in-out infinite;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: #25f4ee;
            bottom: 0%;
            right: -10%;
            animation: float2 22s ease-in-out infinite;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: #7cff6b;
            top: 40%;
            left: 40%;
            animation: float3 26s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(120px, 80px) scale(1.15); }
            66%      { transform: translate(-40px, 140px) scale(0.9); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(-100px, -60px) scale(0.9); }
            66%      { transform: translate(-160px, 40px) scale(1.2); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-30%, -60%) scale(1.3); }
        }

        header, .tiles-container {
            position: relative;
            z-index: 2;
        }

        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
            border-radius: 22px;
            padding: 18px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            /* szkło */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);
            overflow: hidden;
        }

        /* animowany połysk przesuwający się po szybie */
        header::before,
        .tile::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 60%;
            height: 200%;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(255, 255, 255, 0.25) 45%,
                rgba(255, 255, 255, 0.05) 55%,
                transparent 100%
            );
            transform: rotate(20deg);
            animation: sheen 7s ease-in-out infinite;
            pointer-events: none;
        }

        .tile::before {
            animation-duration: 9s;
        }

        @keyframes sheen {
            0%   { left: -60%; }
            50%  { left: 120%; }
            100% { left: 120%; }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
        }

        .logo-g {
            background: white;
            color: #1a4d2e;
            font-weight: bold;
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        .date-time {
            text-align: right;
            line-height: 1.3;
        }

        .date-time .time {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .date-time .date {
            font-size: 13px;
            opacity: 0.8;
            text-transform: capitalize;
        }

        .tiles-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .tile {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            padding: 45px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-decoration: none;
            color: white;

            /* szkło */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);

            transition: transform 0.3s ease, background 0.3s ease;
        }

        .tile:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.14);
        }

        .tile .icon {
            font-size: 44px;
            position: relative;
            z-index: 2;
        }

        .tile .label {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }

        .user-info, .date-time {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header>
        <div class="user-info">
            <div class="logo-g">G</div>
            <span>Witaj, Fan</span>
        </div>
        <div class="date-time">
            <div class="time" id="clock">--:--</div>
            <div class="date" id="today">ładowanie...</div>
        </div>
    </header>

    <div class="tiles-container">
        <a href="https://instagram.com" class="tile">
            <div class="icon">📸</div>
            <div class="label">Instagram</div>
        </a>
        <a href="https://tiktok.com" class="tile">
            <div class="icon">🎵</div>
            <div class="label">TikTok</div>
        </a>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('today').textContent = now.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
