<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genzie Hub</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #1a4d2e 0%, #2e3b2e 45%, #0f2e1a 100%);
            background-attachment: fixed;
            color: white;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* delikatne kolorowe plamy w tle, żeby szkło miało co refraktować */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #e1306c;
            top: 10%;
            left: -100px;
            opacity: 0.35;
        }

        body::after {
            width: 450px;
            height: 450px;
            background: #25f4ee;
            bottom: 5%;
            right: -120px;
            opacity: 0.3;
        }

        header.liquidGL {
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
            border-radius: 22px;
            z-index: 2;
        }

        header .content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 26px;
            position: relative;
            z-index: 3;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
        }

        .logo-g {
            background: white;
            color: #1a4d2e;
            font-weight: bold;
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        .date-time {
            text-align: right;
            line-height: 1.3;
        }

        .date-time .time {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .date-time .date {
            font-size: 13px;
            opacity: 0.8;
            text-transform: capitalize;
        }

        .tiles-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            z-index: 2;
        }

        .tile.liquidGL {
            border-radius: 22px;
            z-index: 2;
            text-decoration: none;
            color: white;
        }

        .tile .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 45px 25px;
            position: relative;
            z-index: 3;
        }

        .tile .icon {
            font-size: 44px;
        }

        .tile .label {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header class="liquidGL">
        <div class="content">
            <div class="user-info">
                <div class="logo-g">G</div>
                <span>Witaj, Fan</span>
            </div>
            <div class="date-time">
                <div class="time" id="clock">--:--</div>
                <div class="date" id="today">ładowanie...</div>
            </div>
        </div>
    </header>

    <div class="tiles-container">
        <a href="https://instagram.com" class="tile liquidGL">
            <div class="content">
                <div class="icon">📸</div>
                <div class="label">Instagram</div>
            </div>
        </a>
        <a href="https://tiktok.com" class="tile liquidGL">
            <div class="content">
                <div class="icon">🎵</div>
                <div class="label">TikTok</div>
            </div>
        </a>
    </div>

    <!-- html2canvas – wymagane przez liquidGL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
