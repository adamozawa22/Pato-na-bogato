<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genzie Hub</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #0f2e1a 0%, #1a4d2e 50%, #0f2e1a 100%);
            color: white;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Płynące, animowane plamy koloru w tle (liquid blobs) */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.45;
            will-change: transform;
            pointer-events: none;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: #e1306c;
            top: 5%;
            left: -10%;
            animation: float1 18s ease-in-out infinite;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: #25f4ee;
            bottom: 0%;
            right: -10%;
            animation: float2 22s ease-in-out infinite;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: #7cff6b;
            top: 40%;
            left: 40%;
            animation: float3 26s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(120px, 80px) scale(1.15); }
            66%      { transform: translate(-40px, 140px) scale(0.9); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(-100px, -60px) scale(0.9); }
            66%      { transform: translate(-160px, 40px) scale(1.2); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-30%, -60%) scale(1.3); }
        }

        /* kontener na przeciągalne elementy - absolutne pozycjonowanie */
        #canvas {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            z-index: 2;
        }

        .draggable {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .draggable:active {
            cursor: grabbing;
        }

        header {
            border-radius: 22px;
            padding: 18px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            width: 500px;
            max-width: 90vw;

            /* szkło */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);
            overflow: hidden;
        }

        /* animowany połysk przesuwający się po szybie */
        header::before,
        .tile::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 60%;
            height: 200%;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(255, 255, 255, 0.25) 45%,
                rgba(255, 255, 255, 0.05) 55%,
                transparent 100%
            );
            transform: rotate(20deg);
            animation: sheen 7s ease-in-out infinite;
            pointer-events: none;
        }

        .tile::before {
            animation-duration: 9s;
        }

        @keyframes sheen {
            0%   { left: -60%; }
            50%  { left: 120%; }
            100% { left: 120%; }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            position: relative;
            z-index: 2;
        }

        .logo-g {
            background: white;
            color: #1a4d2e;
            font-weight: bold;
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }
