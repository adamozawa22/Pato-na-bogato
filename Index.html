<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genzie Hub</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #0f2e1a 0%, #1a4d2e 50%, #0f2e1a 100%);
            color: white;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Płynące, animowane plamy koloru w tle (liquid blobs) */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.45;
            will-change: transform;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: #e1306c;
            top: 5%;
            left: -10%;
            animation: float1 18s ease-in-out infinite;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: #25f4ee;
            bottom: 0%;
            right: -10%;
            animation: float2 22s ease-in-out infinite;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: #7cff6b;
            top: 40%;
            left: 40%;
            animation: float3 26s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(120px, 80px) scale(1.15); }
            66%      {
