<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genzie Hub</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --accent: #0a0a0a;
    --muted: #6b6b6b;
    --line: #0a0a0a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #ffffff;
      --accent: #ffffff;
      --muted: #a0a0a0;
      --line: #ffffff;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .badge {
    display: inline-block;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 32px;
    font-weight: 600;
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  p {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 40px;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: var(--line);
    margin: 0 auto 40px;
  }

  .socials {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .socials a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 24px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .socials a:hover {
    background: var(--fg);
    color: var(--bg);
  }

  footer {
    margin-top: 56px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Zamknięte</div>
    <h1>Genzie Hub<br></h1>
    <p>Strona nie działa i nie będzie. Ogarniecie nas tu:</p>

    <div class="divider"></div>

    <div class="socials">
      <a href="https://www.instagram.com/melanz.onlinemess/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@melanz.onlinemess" target="_blank" rel="noopener">TikTok</a>
    </div>


  </div>
</body>
</html>
